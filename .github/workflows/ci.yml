name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# A push that lands while an earlier run is still going supersedes it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast structural checks. These need no Nix and no Qt, so they fail in
  # seconds rather than after a full toolchain build.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: metadata.json is valid and self-consistent
        run: |
          set -eu
          for dir in radicle radicle-ui; do
            meta="$dir/metadata.json"
            python3 - "$meta" <<'PY'
          import json, sys
          path = sys.argv[1]
          with open(path) as fh:
              meta = json.load(fh)

          for key in ("name", "version", "type", "main"):
              assert key in meta, f"{path}: missing '{key}'"

          # `name` is used as a C identifier by the generated glue.
          name = meta["name"]
          assert name.isidentifier(), f"{path}: name '{name}' is not a valid C identifier"

          if meta["type"] == "core":
              # Basecamp resolves a core module's entry point as <name>_plugin.
              assert meta["main"] == f"{name}_plugin", \
                  f"{path}: main must be '{name}_plugin', got '{meta['main']}'"

          if meta["type"] == "ui_qml":
              # A ui_qml plugin with no `view` is silently skipped by basecamp
              # — the app appears in the sidebar and clicking it does nothing.
              assert meta.get("view"), f"{path}: ui_qml requires 'view'"
              assert meta.get("icon"), f"{path}: ui_qml requires 'icon'"

          print(f"{path}: ok ({meta['type']})")
          PY
          done

      - name: UI declares the core module as a dependency, at the same version
        run: |
          python3 - <<'PY'
          import json
          core = json.load(open("radicle/metadata.json"))
          ui   = json.load(open("radicle-ui/metadata.json"))
          assert core["name"] in ui["dependencies"], \
              f"radicle-ui must declare '{core['name']}' in dependencies"
          # The two ship as a pair from one tag, and the catalog references
          # them by version, so a bump that touches only one file publishes a
          # mismatched pair. The step above loads both files already; two
          # release commit messages have claimed this check existed when it
          # did not.
          assert core["version"] == ui["version"], \
              (f"module versions disagree: radicle {core['version']} vs "
               f"radicle_ui {ui['version']} — bump both")
          print(f"ok: radicle-ui depends on {core['name']}, both at {core['version']}")
          PY

      - name: no QML component shadows a Qt built-in
        run: |
          set -eu
          # A local Foo.qml whose name matches a QtQuick(.Controls) type is
          # silently ignored — the built-in wins and the failure surfaces much
          # later as "Cannot assign to non-existent property".
          reserved="TabBar SearchField Button Label TextField ComboBox ScrollView
                    StackView Page Pane Frame Control Popup Menu Dialog Slider
                    Switch CheckBox RadioButton ToolBar SpinBox Drawer Action
                    Item Text Rectangle Image Row Column Grid Flow Repeater"
          fail=0
          for f in radicle-ui/src/qml/*.qml; do
            n=$(basename "$f" .qml)
            for r in $reserved; do
              if [ "$n" = "$r" ]; then
                echo "::error file=$f::'$n' shadows the Qt built-in type of the same name — rename it"
                fail=1
              fi
            done
          done
          [ "$fail" -eq 0 ] && echo "ok: no shadowed component names"

      - name: every QML file importing layouts declares the import
        run: |
          set -eu
          fail=0
          for f in radicle-ui/src/qml/*.qml; do
            if grep -qE '\b(ColumnLayout|RowLayout|GridLayout|StackLayout|Layout\.)' "$f" \
               && ! grep -q 'import QtQuick.Layouts' "$f"; then
              echo "::error file=$f::uses a Layout type without 'import QtQuick.Layouts'"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "ok: layout imports present"

  qml:
    name: QML lint and component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev \
            qt6-declarative-dev-tools \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates \
            qml6-module-qtquick-window qml6-module-qttest \
            qml6-module-qtqml-workerscript libgl1-mesa-dev

      # qmllint does NOT catch a syntax error: it reported "ok" on a file Qt
      # then refused with "Unexpected token `}'", and basecamp surfaces that
      # failure nowhere the user can see — the app just does nothing when
      # clicked. So parse every file for real, first.
      - name: QML parses
        run: sh radicle-ui/tests/check-qml-syntax.sh

      - name: qmllint
        run: |
          set -eu
          cd radicle-ui/src/qml
          # qmllint exits non-zero on warnings too; only errors should fail CI.
          out=$(qmllint6 -I . *.qml 2>&1 || qmllint -I . *.qml 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -qiE '^.*:[0-9]+:[0-9]+: (error|Error)'; then
            echo "::error::qmllint reported errors"
            exit 1
          fi

      - name: Component tests
        env:
          # Fail rather than skip when no usable runner is present. Without
          # this the job passed while running no tests at all.
          REQUIRE_QML_TESTS: "1"
        run: |
          export QT_QPA_PLATFORM=offscreen
          sh radicle-ui/tests/run-qml-tests.sh | tee /tmp/qml-tests.log
          # Belt and braces: assert every spec actually reported totals, so a
          # runner that exits 0 having done nothing cannot pass either. The
          # counts must also match the number of tst_*.qml files present.
          specs=$(ls radicle-ui/tests/tst_*.qml | wc -l)
          totals=$(grep -cE "^Totals: [0-9]+ passed" /tmp/qml-tests.log || true)
          echo "spec files: $specs, Totals lines: $totals"
          test "$totals" -eq "$specs"

  # The Rust local-node backend (radicle/rust-ffi). Its tests build real
  # Radicle profiles on disk and read them back, which is the layer that can
  # prove the local* JSON shapes — the C++ tests can only prove the FFI
  # boundary, because building a profile from C++ would mean reimplementing
  # `rad auth`.
  #
  # Run here on plain cargo rather than through Nix: the module build compiles
  # the crate with `doCheck = false` (a plugin rebuild should not pay for the
  # fixtures), so without this job nothing in CI would execute a single one of
  # these tests and a green run would say nothing about the crate.
  rust:
    name: Rust backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: radicle/rust-ffi

      # libgit2-sys and openssl-sys prefer system libraries when pkg-config
      # finds them, and vendor their own otherwise. Installing them keeps the
      # build close to what Nix produces.
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev zlib1g-dev

      - name: Formatting
        run: cargo fmt --manifest-path radicle/rust-ffi/Cargo.toml --check

      - name: Clippy
        run: |
          cargo clippy --manifest-path radicle/rust-ffi/Cargo.toml \
            --all-targets -- -D warnings

      # `| tee` then assert on the output, matching what the QML job does: a
      # runner that exits 0 having executed nothing has passed twice in this
      # repository's history, and the crate's own tests were once
      # env-var-gated to skip silently. Counting the reported tests makes that
      # shape impossible to miss.
      - name: Tests
        run: |
          set -eu -o pipefail
          cargo test --manifest-path radicle/rust-ffi/Cargo.toml \
            | tee /tmp/cargo-test.log
          passed=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/cargo-test.log \
                   | grep -oE '[0-9]+' | paste -sd+ | bc)
          echo "tests passed: $passed"
          # A floor, not an exact count, so adding a test does not fail CI —
          # but deleting the suite, or reintroducing a skip, does.
          test "$passed" -ge 28

  # The end-to-end UI specs need a Basecamp built with the QML inspector (a
  # compile-time feature, off in shipping builds), so running them in CI means
  # building Basecamp first — minutes, not seconds. Validating the specs is
  # cheap, though, and catches schema mistakes before anyone runs them.
  ui-specs:
    name: UI spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Specs parse against the sitometres schema
        run: |
          set -eu
          npm install --no-save --silent @paradoxcomputer/sitometres yaml
          for spec in radicle-ui/tests/ui/*.yaml; do
            node - "$spec" <<'JS'
          import { readFileSync } from "node:fs";
          import { parse } from "yaml";
          import { validateSpec } from "@paradoxcomputer/sitometres";
          const path = process.argv[2];
          const spec = validateSpec(parse(readFileSync(path, "utf8")), path);
          console.log(`${path}: ok (${spec.steps.length} steps)`);
          JS
          done

  build:
    name: Build LGX (${{ matrix.variant }})
    # One runner per platform, each building natively — nothing
    # cross-compiles. This mirrors the catalog's own release action
    # (logos-modules-release-action's release.yml maps darwin-arm64 to
    # macos-latest), and it has to: `lgs basecamp build` has no
    # target-system flag, so the only way to get a variant is to run it on
    # that platform.
    #
    # `fail-fast: false` so one platform's failure still lets the others
    # report — but note this does NOT make a partial release possible. The
    # `release` job below requires all three artifacts and errors when any
    # is missing; fail-fast only buys a complete picture of what broke.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: linux-amd64
            runs-on: ubuntu-latest
          - variant: linux-arm64
            runs-on: ubuntu-24.04-arm
          - variant: darwin-arm64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    env:
      # One place, so the cache key cannot desync from the installed version —
      # a desync would silently serve an older binary under a key claiming the
      # new one. Keep in step with ui-tests.yml.
      #
      # TEMPORARY: a git rev, not a crates.io version. `build --print-output`
      # is from logos-co/scaffold#266, which is open, so no published release
      # carries it. ui-tests.yml needs the same build for `setup --inspector`,
      # and the two must stay on one rev — a job pair on different scaffold
      # builds is exactly the desync this env var exists to prevent.
      #
      # Revert to `LGS_VERSION: "<next release>"` and a plain
      # `cargo install logos-scaffold --version …` once #266 ships in one.
      #
      # If EVERY job in both workflows suddenly fails in `cargo install`, this
      # is the first thing to check: the rev lives on an unmerged PR branch,
      # kept alive only by that PR. A force-push plus a close, or the branch
      # being deleted, makes it unfetchable. The fix is to re-pin to #266's
      # current head, not to debug cargo.
      LGS_REV: cd4fe509badf84929135aee73972bafee30d30e8
    steps:
      - uses: actions/checkout@v7

      # DeterminateSystems' installer rather than cachix/install-nix-action,
      # which fails outright on the macos-latest runner: it tries to create
      # the `_nixbld*` build users the image already provisions, and dies with
      # `<dscl_cmd> DS Error: -14135 (eDSRecordAlreadyExists)`. Verified here
      # — the darwin-arm64 leg failed in that step in 25s on this matrix's
      # first run. DS detects a pre-existing install and skips user creation
      # on all three runners used below.
      #
      # This is the same installer, for the same stated reason, that the
      # catalog's own release action uses to build these modules' darwin
      # variant — so the two pipelines now agree on how nix gets onto a mac.
      #
      # Pinned to an immutable release SHA rather than a moving tag: this
      # action installs a toolchain that then builds everything published
      # from this repo.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            experimental-features = nix-command flakes

      # macos-latest ships without the Metal toolchain, and part of the Qt /
      # graphics closure needs `xcrun metal` present to build. Cheap no-op
      # when it is already there, so it is unconditional on macOS rather than
      # gated on a build failure. Lifted from the catalog's release action,
      # which hit the same wall building this repo's darwin variant.
      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: |
          set -eu
          if /usr/bin/xcrun metal --version >/dev/null 2>&1; then
            echo "Metal toolchain present"
            exit 0
          fi
          echo "Metal toolchain missing, downloading..."
          xcodebuild -downloadComponent MetalToolchain
          /usr/bin/xcrun metal --version

      # Persist /nix/store between runs. `install-nix-action` alone does NOT
      # do this — it installs nix and leaves an empty store — so before this
      # step every run rebuilt or re-downloaded its whole closure.
      #
      # It matters much more now that the matrix covers three platforms than
      # it did when this job was linux-amd64 only. amd64 was never really
      # cold: cache.nixos.org has substitutes for essentially all of nixpkgs,
      # so a "cold" run was mostly download. aarch64-darwin has far thinner
      # coverage, and this repo compiles the `radicle` crate and the *-sys
      # crates (libgit2, libssh2, openssl) from source — so on macOS the cost
      # is real compilation that a substituter cannot remove, and the store
      # cache is the only thing that removes it.
      #
      # Keyed per-platform on the flake inputs. `runner.os` alone would let a
      # linux and a macOS run collide on one key, and `matrix.variant`
      # separates the two Linux arches, whose store paths differ entirely.
      # radicle-ui has no committed flake.lock, so the .nix files are in the
      # key too — hashFiles yields "" for a path matching nothing, which would
      # otherwise leave the key keyed on nothing that changes.
      #
      # `restore-prefixes-first-match` means a flake edit still restores the
      # previous run's store and rebuilds only what changed, rather than
      # starting empty.
      #
      # v7, not v5: v5 calls a retired Actions cache API and fails to restore
      # with "Cache service responded with 400", and its tar cannot read
      # root-owned nix daemon state. ui-tests.yml carries the full account of
      # both, which is where this configuration is copied from.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-build-${{ matrix.variant }}-${{ hashFiles('radicle/flake.nix', 'radicle-ui/flake.nix', 'radicle/flake.lock', 'radicle-ui/flake.lock', 'radicle/rust-ffi/Cargo.lock') }}
          restore-prefixes-first-match: nix-build-${{ matrix.variant }}-
          # Both suffixes are needed: the action's size knobs are per-OS, and
          # naming only the linux one would leave the macOS store ungoverned
          # and growing until it blew the 10 GB repo cache quota — evicting
          # every other cache here as a side effect.
          gc-max-store-size-linux: 8G
          gc-max-store-size-macos: 8G
          purge: true
          purge-prefixes: nix-build-${{ matrix.variant }}-
          purge-created: 604800

      # `lgs` builds the modules below. There is no flake and no release
      # binary for logos-scaffold — `cargo install` is the documented install
      # path — so this is a Rust build, cached on ~/.cargo.
      #
      # Pinned to an exact rev on purpose: an unpinned `cargo install` would
      # silently change the tool that drives every module build here. Bump
      # deliberately.
      # Cache the BINARY, not `~/.cargo`. `cargo install` builds in a throwaway
      # target dir, so caching the registry saves only the crates.io download
      # and still pays the full ~60s compile of ~130 crates on every run. And
      # caching all of `~/.cargo/bin` would overlay this runner image's
      # cargo/rustc/rustup shims onto a future one.
      #
      # Exact-match key with NO restore-keys, deliberately: a prefix match
      # would restore a different version's binary and the gate below would
      # then skip installing the version we actually pinned. Bumping
      # LGS_REV starts a clean cache, which is the point.
      #
      # Keyed on `matrix.variant`, NOT `runner.os`. `runner.os` is `Linux` for
      # both ubuntu-latest and ubuntu-24.04-arm, so an arch-blind key let the
      # arm64 job restore the x86_64 binary, hit the cache, skip the install
      # below, and then die with exit 126 (exec format error) on the first
      # `lgs` call. That is precisely what happened the first time this matrix
      # ran. The variant name carries the arch, so it cannot recur.
      - name: Cache lgs
        id: lgs-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/lgs
          key: lgs-${{ matrix.variant }}-git-${{ env.LGS_REV }}

      # Gated on the cache miss rather than using `--force`: on a hit there is
      # nothing to do, and `--force` would unconditionally rebuild. Without the
      # gate a plain `cargo install` exits 101 with "binary `lgs` already
      # exists in destination".
      - name: Install logos-scaffold
        if: steps.lgs-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/logos-co/scaffold.git --rev ${{ env.LGS_REV }} logos-scaffold --locked

      # Unit tests for the core module's logic (URL building, ref resolution,
      # pagination, error shapes, local-profile detection).
      #
      # Built explicitly rather than via `nix flake check`: that only evaluates
      # the derivation ("running 0 flake checks") and so passes even when the
      # test binary does not link.
      #
      # Scoped to linux-amd64 rather than run on all three: the logic under
      # test is platform-independent, and `checks.<system>.unit-tests` is
      # realisable per-system anyway (see radicle/flake.nix's note on
      # `extraBuildInputs` covering every `ffiSystems` entry). Running it once
      # keeps the arm64 and darwin jobs to what only they can do — produce
      # their own platform's artifact.
      - name: Core module tests
        if: matrix.variant == 'linux-amd64'
        run: |
          cd radicle
          nix build ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem).unit-tests" \
            -L --out-link result-test

      # Both modules, both variants, one command. `lgs` reads the captured
      # [modules.*] table in scaffold.toml, builds in dependency order, and
      # derives `--override-input radicle path:../radicle` for radicle-ui
      # itself by parsing its flake.nix — which is why that input must stay on
      # a single line (scaffold's parser is line-based).
      #
      # This needs NO `lgs basecamp setup`: that step exists to pin and build
      # the basecamp + lgpm binaries and seed the alice/bob profiles, none of
      # which a build touches. `lgs basecamp docs` names "CI / sandboxed
      # environments where `lgs basecamp setup` can't or shouldn't run" as a
      # supported case for a hand-authored [modules.*] table, and this job is
      # exactly that. Verified: the build below runs green on a checkout with
      # no `.scaffold/` in it.
      #
      # Artefacts land at deterministic paths, one directory per variant:
      #   .scaffold/basecamp/lgx/<NN>-<module>.lgx        (dev)
      #   .scaffold/basecamp/portable/<NN>-<module>.lgx   (portable)
      # as symlinks into the nix store, NN being the load-order index. That
      # per-module, per-variant addressing is what the steps below rely on.
      #
      # Both variants are still BUILT, but only portable is published — see
      # the staging step. The dev variant is kept here as a compile gate: it
      # is what `lgs basecamp install` produces locally, so a change that
      # breaks only the dev build should fail CI rather than surface on a
      # contributor's machine. It costs little, since the two share almost
      # every derivation.
      #
      # `--print-output` streams nix's output into this step's log rather than
      # writing it to `.scaffold/logs/` on a runner that is about to be
      # destroyed. It only matters when a build fails — but that is the only
      # time anyone reads it. Restores what `nix build -L` gave before the
      # conversion to `lgs`.
      - name: Build both modules (dev + portable)
        run: lgs basecamp build --variant all --print-output

      # The `view` field must survive packaging: without it basecamp skips the
      # plugin silently. This is the check that would have caught the app
      # appearing in the sidebar and doing nothing when clicked.
      #
      # Deliberately scoped to radicle_ui, the only `ui_qml` module here — a
      # second one would need adding explicitly (the pre-lgs version globbed
      # the UI sub-flake's output and would have picked it up for free).
      - name: Packaged manifest keeps its ui_qml entry points
        run: |
          set -eu
          for variant in lgx portable; do
            tar xzf .scaffold/basecamp/$variant/02-radicle_ui.lgx -O manifest.json > /tmp/m.json
            python3 - "$variant" <<'PY'
          import json, sys
          m = json.load(open("/tmp/m.json"))
          assert m.get("view"), "packaged manifest lost its 'view' — basecamp will skip this plugin"
          assert m.get("main"), "packaged manifest lost its 'main'"
          assert m.get("icon"), "packaged manifest lost its 'icon'"
          print(f"ok ({sys.argv[1]}):", m["name"], "view =", m["view"])
          PY
          done

      # The release contract is the filename: the `release` job merges these
      # per-platform files and publishes exactly these two names, so they are
      # spelled out here rather than derived. `lgs` names its symlinks
      # `<NN>-<module>.lgx` for load-order legibility — a different naming
      # scheme with a different purpose — so this step maps one to the other
      # explicitly. `cp -L` dereferences the symlink into the store.
      #
      # PORTABLE ONLY. The dev variant is deliberately not published: it
      # resolves its libraries from the host nix store, so it loads only in a
      # basecamp built from source on a machine that has those exact store
      # paths — which a release asset downloaded from GitHub never is. Shipping
      # it invited someone to install the wrong one of two similarly-named
      # files and get basecamp's silent-skip failure. It is still built above,
      # as a compile gate.
      #
      # The `NN` prefixes are load-order indices, so this mapping is
      # position-dependent. Adding a third module can renumber them — hence
      # `stage` asserts each package's own manifest name matches the module
      # expected at that position, turning a renumbering into a named error
      # rather than the wrong binary published under a catalog-referenced name.
      - name: Stage artifacts
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          stage() {   # stage <lgx> <expected module> <release filename>
            name=$(tar xzf "$1" -O manifest.json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            [ "$name" = "$2" ] || {
              echo "::error::$1 packages module '$name', expected '$2' — has the load order changed?"
              exit 1
            }
            cp -L "$1" "dist/$3"
          }
          stage .scaffold/basecamp/portable/01-radicle.lgx    radicle    logos-radicle-module-lib.lgx
          stage .scaffold/basecamp/portable/02-radicle_ui.lgx radicle_ui logos-radicle_ui-module.lgx
          # The portable and dev source directories differ by one path segment,
          # so transposing them would publish dev artefacts under the portable
          # names — correctly-named files that fail to load in an AppImage,
          # with one warning line and nothing else. Assert the variant.
          #
          # The expected variant is the matrix platform, not a constant: that
          # is what makes this also a check that each runner produced ITS OWN
          # platform's artifact. A misconfigured matrix entry that ran the
          # arm64 job on an amd64 runner would otherwise upload a second
          # amd64 package under an arm64 artifact name, and `lgx merge` would
          # reject the duplicate variant much later with a less obvious error.
          #
          # `grep -c` rather than `grep -q`: `-q` exits at the first match and
          # closes the pipe, so `tar` dies of SIGPIPE and the pipeline reports
          # 141. That is invisible under a bare `set -eu` (which is why the
          # equivalent check passed here for several releases) but becomes a
          # spurious failure the moment anyone adds `-o pipefail` to this
          # step. Counting consumes all of tar's output, so there is no signal
          # either way.
          for f in dist/logos-radicle-module-lib.lgx dist/logos-radicle_ui-module.lgx; do
            [ "$(tar tzf "$f" | grep -c '^variants/${{ matrix.variant }}/')" -gt 0 ] \
              || { echo "::error::$f is not a portable ${{ matrix.variant }} build — dev/portable swapped, or wrong runner?"; exit 1; }
          done
          ls -la dist/

      # Per-platform artifact names, so the release job can pull all three and
      # tell them apart. `lgx merge` needs each platform's package as its own
      # file; a shared artifact name would have them overwrite each other.
      - uses: actions/upload-artifact@v7
        with:
          name: radicle-lgx-${{ matrix.variant }}
          path: dist/*.lgx

  release:
    name: Release
    # No `if: always()`, and that is the deliberate half of this job. The
    # catalog's action releases on partial success (fail-fast:false plus
    # `if: always()`), which is how radicle v0.2.0 shipped linux-amd64 alone
    # with the only signal a "Missing variants" line in a body nobody reads —
    # see radicle/flake.nix's note on `ffiSystems`. Here a failed platform
    # fails the release outright: the tag exists, no assets appear, and the
    # problem is loud. Re-run the job after fixing, or delete the tag.
    needs: [lint, qml, rust, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Each platform's packages land in their own subdirectory, named by the
      # artifact — `_per-platform/radicle-lgx-<variant>/<file>.lgx`.
      - uses: actions/download-artifact@v8
        with:
          path: _per-platform
          pattern: radicle-lgx-*

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `lgx` is the tool that merges per-platform packages into one
      # multi-variant package. It is not in nixpkgs — it comes from
      # logos-co/logos-package, the same source the catalog's release action
      # uses. Put it on PATH once rather than `nix run`-ing it per merge.
      - name: Set up lgx CLI
        run: |
          set -eu
          nix build github:logos-co/logos-package#lgx --out-link "$RUNNER_TEMP/lgx-tool"
          echo "$RUNNER_TEMP/lgx-tool/bin" >> "$GITHUB_PATH"

      # One multi-variant .lgx per module, carrying all three platforms —
      # the same shape the catalog publishes, and the reason the filenames do
      # not change: a single `logos-radicle-module-lib.lgx` works everywhere,
      # so nothing downstream has to choose.
      #
      # EVERY platform is required. `lgx merge` would happily produce a
      # two-platform package, so the count is asserted here first: that is
      # what turns a missing runner into a failed release rather than a quiet
      # single-platform one. The explicit per-file check names which platform
      # is absent, which the merge's own error would not.
      - name: Merge per-platform packages
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          for module in logos-radicle-module-lib logos-radicle_ui-module; do
            inputs=""
            for variant in linux-amd64 linux-arm64 darwin-arm64; do
              f="_per-platform/radicle-lgx-$variant/$module.lgx"
              [ -f "$f" ] || {
                echo "::error::$module is missing its $variant build — refusing to publish a partial release"
                exit 1
              }
              inputs="$inputs $f"
            done
            # shellcheck disable=SC2086
            lgx merge $inputs -o "dist/$module.lgx" -y
          done
          # Assert the merge actually produced all three, rather than trusting
          # it: a package silently missing a variant is the exact failure this
          # job exists to prevent, and `lgx merge`'s own output is not a
          # guarantee about the file's contents.
          # `grep -c`, not `grep -q` — see the note in the staging step: `-q`
          # closes the pipe on first match and leaves `tar` killed by SIGPIPE,
          # which turns into a spurious failure under `-o pipefail`.
          for f in dist/*.lgx; do
            for variant in linux-amd64 linux-arm64 darwin-arm64; do
              [ "$(tar tzf "$f" | grep -c "^variants/$variant/")" -gt 0 ] \
                || { echo "::error::$f lost its $variant variant during merge"; exit 1; }
            done
          done
          ls -la dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.lgx
          generate_release_notes: true
          body: |
            Radicle browser modules for Logos Basecamp.

            Each `.lgx` carries all three supported platforms — `linux-amd64`,
            `linux-arm64` and `darwin-arm64` — so there is one file per module
            to download whatever you are running.

            | file | module |
            |---|---|
            | `logos-radicle-module-lib.lgx` | `radicle` (core) |
            | `logos-radicle_ui-module.lgx` | `radicle_ui` (UI) |

            Install the core module first, then the UI.
