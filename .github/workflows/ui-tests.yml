name: UI tests

# Runs the sitometres end-to-end spec against a real Basecamp: real clicks
# through the QML inspector, the real QtRO transport, and the real `radicle`
# core module talking to a real seed node.
#
# Kept out of ci.yml on purpose: it builds Basecamp from source (see below) and
# needs the network for every step, where every job in ci.yml is seconds to a
# few minutes. So it runs on pushes to main (post-merge) and on demand.
#
# Whether it could also run on `pull_request` is now a live question rather
# than a settled one, because the "tens of minutes" this comment used to claim
# was never true. Measured end to end, all 18 spec steps passing in both:
#
#                          cold (33712429609)   warm (33714298503)
#   whole job                        8m43s              3m14s
#   build Basecamp                   6m00s              1m21s
#   paths from substituters            676                  0
#
# The cold cost is dominated by pulling the closure (~4.5m of that 6m; only
# ~1.5m is Basecamp actually compiling), and a restored store removes it
# outright — the warm run downloaded nothing at all. 3m14s is comfortably
# PR-affordable, and the fast layers in ci.yml already cost a couple of minutes.
#
# Two caveats before anyone moves this to `pull_request`. Cache scoping: a PR
# branch can read main's cache, but a PR from a FORK gets its own isolated
# scope and would always run cold, i.e. ~9m. And the first run after any
# Basecamp pin bump is cold by construction, since the rev is in the key.
#
# ─── why Basecamp is BUILT and not fetched ──────────────────────────────────
# sitometres attaches to Basecamp's QML inspector. That is a compile-time
# feature and is off in every SHIPPING build (`#bin-bundle-dir`, `#bin-appimage`,
# `#bin-macos-app` all pass `enableInspector = false`), so a released artefact
# cannot be used and Basecamp is built from source.
#
# The target is `#app`, the DEV build — see "Why the dev #app" on the build
# step below.
#
# Measured on 2026-09-03 against rev aa23776 (Basecamp 0.2.3): that output is
# NOT in the logos public binary cache. Checked two ways —
#
#   curl https://cache.nix.logos.co/public/0bkhqsq5fl6wr6wsiyq4cjx92538gvld.narinfo   -> 404
#   nix path-info --store https://cache.nix.logos.co/public /nix/store/0bkhq…-logos-basecamp-bundle-0.2.3
#                                                                     -> "path is not valid"
#
# and `nix build --dry-run` lists `logos-basecamp-0.2.3.drv` under "these 9
# derivations will be built", not under "will be fetched". The plain
# (non-inspector) `#bin-bundle-dir` and `#app` are absent too, so this is not
# an inspector-only gap — nothing for 0.2.3 at that rev is published.
#
# Consequences, and why the job is shaped the way it is:
#   * timeout-minutes is 120, matching Basecamp's own doctests. That is far
#     above the 8m21s actually observed, and deliberately so: it is a backstop
#     against a pathological cold run, not an estimate.
#   * the store is cached across runs with cache-nix-action, which is what
#     actually makes repeat runs fast here. The substituter alone cannot: it
#     does not hold the artefact. It is still configured, because the
#     dependencies AROUND Basecamp do come from it — 676 paths were substituted
#     on the run above, for a resulting store of 5.15 GB.
#   * the rev is pinned, in `[repos.basecamp].pin` in scaffold.toml — the one
#     place it is written. The build step below reads that pin, and the store
#     cache key is derived from it. An unpinned build would recompile on every
#     upstream commit and would also miss the store cache every time.
# If a future Basecamp release publishes an inspector-enabled build, drop the
# store cache and let the substituter do the work — re-check with the curl
# above.

on:
  push:
    branches: [main]
  # Also on PRs. This was originally push-only on the assumption that the job
  # was too slow for the PR path — measured, that was wrong: ~3m14s warm, and
  # the cold cost is mostly fetching the closure rather than compiling
  # Basecamp. Two cases still pay the ~9m cold price and are worth knowing
  # about rather than being surprised by:
  #   - a PR from a fork gets its own isolated cache scope, so it never hits
  #     this repo's cache;
  #   - the first run after `[repos.basecamp].pin` changes in scaffold.toml,
  #     since the rev it names is in the cache key.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: sitometres ${{ matrix.spec }} spec
    runs-on: ubuntu-latest
    # Basecamp's own doctests use 120 for the same from-source bundle build.
    timeout-minutes: 120

    # One job per spec, in parallel. They share the expensive prefix — the
    # Basecamp build — but that is served from the store cache after the first
    # of them warms it, and running them in one job instead would serialise
    # four real-seed runs behind each other for no gain.
    #
    # fail-fast is off: when two specs break it is worth seeing both, and a
    # spec that fails for seed-side reasons should not hide a real failure in
    # another.
    # `write` and `local` are the odd ones out and need two things the others
    # do not: a Rust toolchain, and a seeded Radicle profile. Both are handled
    # by steps below that are `if`-gated on the spec name, so the four
    # seed-only jobs pay nothing for them. They are in the matrix rather than
    # excluded because a spec not in the matrix runs nowhere — the state three
    # of these were in before af9a746.
    #
    # `local` was excluded for a long time on the grounds that a CI runner has
    # no Radicle profile. That reason expired when the write spec's seeder was
    # written: it builds one, and now seeds branches across two peers so the
    # branch picker's grouping is exercised too. Until then the entire `local*`
    # surface — half the module — had no end-to-end coverage anywhere.
    strategy:
      fail-fast: false
      matrix:
        spec: [browse, branches, source, sync, write, local]

    env:
      # NOTE: BASECAMP_REV is NOT set here. It is derived from
      # `[repos.basecamp].pin` in scaffold.toml by the "Resolve the pinned
      # Basecamp rev" step below, which exports it for every later step.
      #
      # It used to be hardcoded here, which made it a second source of truth
      # for one fact. Bump scaffold.toml and forget this, and the store cache
      # silently keys on the old rev: it restores a store full of the previous
      # Basecamp, the build finds nothing useful in it and recompiles from
      # scratch on every run, forever. Nothing errors; the specs still pass;
      # the job just quietly costs ~9 minutes instead of ~3, and CI slowness
      # gets blamed on the runners.
      SPEC: radicle-ui/tests/ui/${{ matrix.spec }}.yaml
      # Where `lgs basecamp build --variant lgx` collects both modules.
      # sitometres takes ONE --app-dir search root and browse.yaml declares
      # `with: [radicle]`, so both .lgx must be findable from here.
      #
      # The DEV directory, not portable — see "Why the dev #app" below.
      APP_DIR: .scaffold/basecamp/lgx
      # Keep in step with ci.yml's build job.
      #
      # A released version, from crates.io. This was pinned to a commit on the
      # unmerged logos-co/scaffold#266 for two flags, and needs neither now:
      #
      #   * `setup --inspector` selected `#bin-bundle-dir-inspector` and
      #     classified it as the portable stack. This job no longer builds a
      #     Basecamp bundle at all — see "Why the dev #app" below.
      #   * `--print-output` on `build` is sugar for
      #     `LOGOS_SCAFFOLD_PRINT_OUTPUT=1`, which `run_logged` reads on every
      #     build path regardless of subcommand. Set as a job env var below.
      #
      # Pinning to an open PR branch cost real time: #266 moved three times,
      # and one move REVERTED a feature this repo had already documented as
      # fixed (`save_project_config`'s comment preservation, pulled out into
      # `fix/preserve-scaffold-toml-comments`), so bumping the pin silently
      # reintroduced `scaffold.toml` comment stripping. A released version
      # cannot do that.
      LGS_VERSION: "0.3.1"

      # The `--print-output` equivalent — see the note in ci.yml. Streams nix
      # output into the step log instead of a `.scaffold/logs/` file on a
      # runner about to be destroyed. Only `1` and `true` are truthy.
      LOGOS_SCAFFOLD_PRINT_OUTPUT: "1"

      # A published release again, not a git commit.
      #
      # This was pinned to a fork commit for the inspector-probe bug: released
      # sitometres refused the BUNDLE with "no Basecamp with the QML inspector
      # compiled in" even though the inspector was there, because
      # `hasInspector()` probed `bin/LogosBasecamp` (a ~5 KB sh wrapper) and
      # `bin/.LogosBasecamp`, never the `bin/.LogosBasecamp.elf` that nix's
      # dirBundler ships for a bundle. Filed as paradoxcomputer/sitometres#1.
      #
      # The dev `#app` this job now runs ships `bin/.LogosBasecamp` — the
      # spelling the released probe has always looked for — so the bug is not
      # on this path at all. Verified by running the browse spec green on both
      # 0.1.0 and 0.1.2 against the dev app before making this change.
      #
      # Pin the VERSION, not a range or `latest`: a moving ref would silently
      # change the tool that gates every spec here.
      SITOMETRES: "@paradoxcomputer/sitometres@0.1.2"

    steps:
      # Action majors are the Node-24 ones. GitHub retired the Node 20 runtime,
      # and until these were bumped every job here logged a deprecation warning
      # naming checkout/cache/setup-node: the runner was already force-running
      # them on Node 24, so the bump matches what was happening anyway rather
      # than changing it. `node-version` is a separate axis — that is the Node
      # sitometres itself runs on, and 20 is EOL, so it moved with them.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Two unrelated needs, one apt transaction, so the job pays the
      # update-and-install cost once:
      #
      #   * the graphics libraries the Basecamp bundle resolves at load time.
      #     It carries its own Qt but NOT host graphics — you cannot bundle a
      #     GPU driver — so a bare runner dies with `libOpenGL.so.0: cannot
      #     open shared object file`. Same list as logos-basecamp's own
      #     doctests workflow.
      #   * `tomlq`, which the next step uses to read the Basecamp pin. That
      #     is why this sits up here rather than just before the bundle is
      #     built: the resolve step needs it, and the cache step needs the
      #     resolve step.
      #
      # `yq` is the Python package that ships `tomlq`. The runner preinstalls
      # a `yq` already, but that is the Go one (v4) and has no `tomlq` — two
      # different tools sharing a name, so this install is not redundant.
      #
      # The runner image preconfigures third-party apt repos this job does not
      # use, and one of them failing takes `apt-get update` — and so the whole
      # job — down with it. Seen for real (run 33826324704, the `sync` job,
      # while its three siblings passed the identical step minutes apart):
      #
      #   E: Failed to fetch https://packages.microsoft.com/ubuntu/24.04/prod/…
      #      403  Forbidden
      #   E: The repository '… noble InRelease' is no longer signed.
      #
      # Not a momentary blip worth retrying through: the runner image already
      # sets `APT::Acquire::Retries "10"`, so apt had retried ten times before
      # surfacing that.
      #
      # Every package below comes from Ubuntu's own archive, so nothing here
      # needs a third-party source. Rather than name one file — the image's
      # layout is not a contract, and a `.list` that has become a deb822
      # `.sources` would make a targeted `rm` silently do nothing — move every
      # extra source out of the way by pattern and keep only the distribution's
      # own. `mv -v` so the log says what was disabled rather than leaving it
      # to be inferred.
      #
      # `update` is then allowed to fail without failing the step: `install`
      # is the real gate and fails loudly if a package cannot be resolved,
      # which is the outcome that actually matters.
      - name: Install graphics runtime libraries and tomlq
        run: |
          set -eu
          sudo mkdir -p /etc/apt/disabled-sources.d
          # `find -exec` rather than a glob: no match must not be an error.
          sudo find /etc/apt/sources.list.d -maxdepth 1 \
            \( -name '*.list' -o -name '*.sources' \) \
            ! -name 'ubuntu.sources' ! -name 'ubuntu.list' \
            -exec mv -v -t /etc/apt/disabled-sources.d {} +
          sudo apt-get update -qq \
            || echo "::warning::apt-get update reported errors; install is the gate, continuing"
          sudo apt-get install -y --no-install-recommends \
            libopengl0 libglx0 libgl1 libegl1 libglu1-mesa libvulkan1 yq
          tomlq --version

      # ONE source of truth for the Basecamp rev: `[repos.basecamp].pin`.
      #
      # The Basecamp build step below consumes BASECAMP_REV, and the store
      # cache is keyed on it, which is what makes this load-bearing: a cache
      # keyed on a rev the build does not use restores a store that cannot
      # help, and the only symptom is that every run is slow.
      #
      # Two ordering constraints, both load-bearing:
      #   * AFTER the apt step, which installs tomlq — which is why that step
      #     sits at the top of the job rather than beside the build it also
      #     serves.
      #   * BEFORE the cache step, which keys on what this exports.
      #
      # A third used to apply — before `setup --inspector`, which rewrote
      # scaffold.toml in place — and is gone with `setup` itself.
      # `tomlq` (from the `yq` package) reads the pin as the TOML value it is
      # rather than regexing the file.
      #
      # Note the runner's preinstalled `yq` is the Go one (v4), which has no
      # `tomlq`; the apt `yq` is the Python one, which does. They are different
      # tools sharing a name, so the install is not redundant.
      - name: Resolve the pinned Basecamp rev
        run: |
          set -eu
          pin=$(tomlq -r '.repos.basecamp.pin' scaffold.toml)
          # A short, empty or branch-name pin would still produce a perfectly
          # usable cache key while silently not being the rev anyone meant.
          # `tomlq -r` also prints the string "null" for a missing key, which
          # this rejects along with the rest.
          #
          # Lowercase is required, not merely conventional: the pin goes into
          # the cache key verbatim, so `AA23…` and `aa23…` would key two
          # separate caches for one rev and halve the hit rate for no visible
          # reason. Rejecting is better than normalising, because scaffold
          # builds whatever the file says and only the file should decide.
          printf '%s' "$pin" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::[repos.basecamp].pin is '$pin', expected a full 40-char lowercase sha"
            exit 1
          }
          echo "BASECAMP_REV=$pin" >> "$GITHUB_ENV"
          echo "BASECAMP_REV=$pin (from scaffold.toml)"

      # Not a GitHub-authored action, so the Node-20 retirement does not reach
      # it — install-nix-action is a composite/Docker action. Left on its pin.
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # The logos substituter is anonymously readable — verified with
          # `curl .../nix-cache-info` -> HTTP 200 — so no token is needed. The
          # attic tokens in logos-co/setup-nix-cache-action are for WRITING.
          #
          # Set here rather than relying on the flake's own nixConfig: a flake's
          # extra-substituters is only honoured for a trusted user, and is
          # otherwise skipped with "ignoring untrusted flake configuration
          # setting". install-nix-action makes the runner user trusted, so
          # putting the substituter in nix.conf makes it apply unconditionally.
          extra_nix_config: |
            experimental-features = nix-command flakes
            extra-substituters = https://cache.nix.logos.co/public
            extra-trusted-public-keys = public:l4HrXgL4nw246+LBh2SOJyhz64BoGegOYLheT/iIAPU=
            accept-flake-config = true

      # The store cache is what makes a repeat run fast. Most of the cold cost
      # is not the Basecamp compile (~1.5 min) but pulling ~5 GB of closure from
      # the substituters (~4.5 min); the cache removes the download, not the
      # compile. Keyed on the pinned rev — resolved from scaffold.toml by the
      # step above, which is also the rev the Basecamp build uses — so bumping the pin
      # starts a fresh cache rather than restoring a store that cannot help.
      #
      # `env.BASECAMP_REV` here resolves against the accumulated step
      # environment, so it does see the $GITHUB_ENV write from that step. It is
      # NOT the job's `env:` map, which no longer sets this at all.
      #
      # v7, not v5. On v5 this step never cached anything — run 33712429609
      # failed both halves, for two independent reasons:
      #
      #   Failed to restore: Cache service responded with 400
      #   Failed to save: '/usr/bin/tar' failed with exit code 2
      #
      #   * the 400 is v5 (March 2024) still calling the legacy Actions cache
      #     API, which GitHub has since retired. It is not size or auth: the
      #     request was refused in 80 ms, on a RESTORE, before any upload, and
      #     the repo holds 0 of its 10 GB quota.
      #   * exit 2 is tar being unable to read root-owned daemon state —
      #     /nix/var/nix/{gc.lock,userpool/*}, /nix/var/nix/db/{reserved,
      #     big-lock}. v7 runs tar under sudo and excludes everything under
      #     /nix/var/nix bar the db.sqlite it actually needs.
      #
      # v7 also fixes a live footgun in the input below, and checkpoints the
      # store's SQLite WAL before saving, so a restored db.sqlite is not missing
      # writes that were still in the WAL when the cache was taken.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # radicle-ui has no flake.lock committed, so the .nix files are in the
          # key too — hashFiles silently yields "" for a path that matches
          # nothing, which would leave the key keyed on the rev alone.
          primary-key: nix-ui-${{ runner.os }}-${{ env.BASECAMP_REV }}-${{ hashFiles('radicle/flake.nix', 'radicle-ui/flake.nix', 'radicle/flake.lock', 'radicle-ui/flake.lock') }}
          restore-prefixes-first-match: nix-ui-${{ runner.os }}-${{ env.BASECAMP_REV }}-
          # Keep the cache from growing without bound across runs. The store
          # measured 5.15 GB on the run above, so 8G leaves headroom without
          # forcing a collection every time.
          #
          # v5 did not understand the G suffix: it interpolated the string into
          # bash arithmetic, so `8G` became `MAX_STORE_SIZE=8` — eight BYTES —
          # and it asked nix to free 5150115832 of them, i.e. the entire store.
          # That only ever did nothing because everything was still held by a GC
          # root. v7 parses the suffix itself and logs the parsed byte value
          # beside the raw input, so check that line if this misbehaves.
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-ui-${{ runner.os }}-
          purge-created: 604800

      # `lgs` builds the two modules below. logos-scaffold has no flake and no
      # release binary, so `cargo install` is the documented install path.
      # Cache the binary, not `~/.cargo` — see the same pair of steps in
      # ci.yml for why (throwaway target dir, and not overlaying the runner's
      # own rust shims). Exact-match key, no restore-keys, on purpose.
      - name: Cache lgs
        id: lgs-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/lgs
          key: lgs-${{ runner.os }}-v${{ env.LGS_VERSION }}

      - name: Install logos-scaffold
        if: steps.lgs-cache.outputs.cache-hit != 'true'
        run: cargo install logos-scaffold --version ${{ env.LGS_VERSION }} --locked

      # ─── Why the dev `#app`, and not the inspector bundle ──────────────────
      #
      # This job used to build `#bin-bundle-dir-inspector` through
      # `lgs basecamp setup --inspector`, on the belief that it was the only
      # Basecamp output with the QML inspector compiled in. It is not. Reading
      # logos-basecamp's flake.nix at the pinned rev:
      #
      #   app                        `inherit logosQtMcp`, no enableInspector
      #                              flag  ->  inspector ON
      #   appDistributed             enableInspector = false, no logosQtMcp
      #                              (feeds #bin-bundle-dir / appimage / macos)
      #   appDistributedWithInspector enableInspector = true
      #                              (feeds #bin-bundle-dir-inspector)
      #
      # The inspector is off in the SHIPPING outputs, which is what that flake
      # comment says — not off in the dev build. Upstream's own inspector-driven
      # `integration-test` and `shutdown-test` checks both use `appPkg = app`.
      #
      # Verified here rather than inferred, by the same probe sitometres uses
      # (searching the binary for "[QmlInspector] Inspector server listening on
      # port"):
      #
      #   #app                        bin/.LogosBasecamp       present
      #   #bin-bundle-dir-inspector   bin/.LogosBasecamp.elf   present
      #   #bin-bundle-dir  (shipping) bin/.LogosBasecamp.elf   ABSENT
      #
      # The shipping row is the control: it proves the probe discriminates
      # rather than matching everything.
      #
      # Three things fall out of using the dev app, and they are why this is a
      # simplification rather than a lateral move:
      #
      #   1. No `setup` at all. `setup` also built lgpm and seeded alice/bob
      #      profiles this job never used, and it REWRITES scaffold.toml,
      #      stripping every comment — which forced the "Resolve the pinned
      #      Basecamp rev" step to run before it. That ordering constraint is
      #      gone with it.
      #   2. No `--variant` override. sitometres' `hostVariant()` defaults to
      #      `linux-amd64-dev`, which is exactly what `.#lgx` produces. The
      #      override existed ONLY because the bundle demands portable variants;
      #      on this path the default is already correct.
      #   3. No dev-vs-portable classification problem, which is the entire
      #      subject of logos-co/scaffold#265 — wrong XDG subpath, wrong lgpm
      #      variant. It only ever arose from choosing the bundle.
      #
      # `--basecamp` points straight at the nix out-link; nothing is copied.
      # The `-o` out-link is the ONLY reason a raw `nix build` appears here:
      # `lgs` has no verb that builds a Basecamp attr without also running
      # `setup`'s profile seeding. The rev comes from BASECAMP_REV, which the
      # resolve step read from `[repos.basecamp].pin` — still the one place it
      # is written.
      - name: Build Basecamp (dev, inspector included)
        run: |
          set -eu
          nix build "github:logos-co/logos-basecamp/$BASECAMP_REV#app" \
            -o result-basecamp --accept-flake-config
          bin="$PWD/result-basecamp/bin/LogosBasecamp"
          test -x "$bin"
          echo "BASECAMP_BIN=$bin" >> "$GITHUB_ENV"

      # The inspector must actually be in there. Without this the failure is
      # sitometres refusing the binary several steps later with "no Basecamp
      # with the QML inspector compiled in" — or worse, a future Basecamp
      # flipping `enableInspector` off for `#app` and this job silently losing
      # the thing it exists to test. Same needle sitometres greps for, against
      # the sibling ELF the nix wrapper execs.
      - name: The build really has the QML inspector
        run: |
          set -eu
          elf="$(dirname "$BASECAMP_BIN")/.LogosBasecamp"
          test -f "$elf" || {
            echo "::error::no .LogosBasecamp beside the wrapper — has the nix output layout changed?"
            exit 1
          }
          grep -aq "\[QmlInspector\] Inspector server listening on port" "$elf" || {
            echo "::error::#app has no QML inspector compiled in — sitometres cannot drive it"
            exit 1
          }
          echo "ok: inspector present"

      # `.#lgx` — the DEV variant, matching the dev Basecamp above. The two
      # halves must agree: a dev Basecamp accepts `linux-amd64-dev` modules and
      # a portable bundle accepts `[linux-x86_64, linux-amd64]`. Mismatch them
      # and Basecamp declines to load the module with one warning line —
      #
      #   Warning: module 'radicle' … was installed for variant '<x>' which is
      #   not supported on this platform and will not be loadable
      #
      # — after which the UI opens to nothing and the spec times out on its
      # first step, with no hint in sitometres' own output as to why. That is
      # the failure this pairing exists to avoid, and it is symmetrical: either
      # half alone reproduces it.
      #
      # `lgs basecamp build` builds both modules in dependency order, derives
      # the `--override-input radicle path:../radicle` itself by parsing
      # radicle-ui/flake.nix, and collects the results into ONE directory —
      # which is what sitometres needs, since --app-dir is a single search root
      # and browse.yaml declares `with: [radicle]`.
      #
      # No `basecamp setup` here: a build touches neither the basecamp binaries
      # nor the profiles, and `lgs basecamp docs` names CI explicitly as a
      # supported hand-authored-[modules]-table case.
      - name: Build both modules (dev)
        run: lgs basecamp build --variant lgx

      # ---- the write spec only ------------------------------------------
      #
      # `write.yaml` is the one spec that CHANGES something, and it needs a
      # Radicle profile with a SIGNABLE key to change it in. A runner has
      # neither, and pointing the spec at a developer's real profile is not an
      # option for something that appends a COB comment on every run — COBs
      # have no delete, so those would accumulate forever.
      #
      # So the profile is built for the run: `seed_write_profile` creates a
      # keystore, one repository and one issue with one comment through the
      # radicle crate's public API. No network, no `rad` binary, no daemon — a
      # COB write is local, which is exactly why this is affordable in CI at
      # all.
      #
      # The keystore is PLAINTEXT (`Profile::init` with no passphrase), which
      # is the only one of the four signer rows in
      # docs/M2.2-write-actions-design.md reachable without prompting a human
      # or putting a passphrase in the environment. That is what makes
      # `canWriteLocal` true here. The key is generated from a fixed seed into
      # a runner directory that is destroyed with the runner and signs nothing
      # that leaves it: a fixture, not a credential.
      #
      # The runner image already ships a Rust toolchain — `cargo install` above
      # depends on it — so there is no toolchain step to add.
      #
      # Gated on the spec name so the four seed-only jobs pay none of this.
      - name: Seed a throwaway Radicle profile (local-source specs)
        if: matrix.spec == 'write' || matrix.spec == 'local'
        run: |
          set -eu
          # Under the runner's workspace, and a path that does not exist yet:
          # the seeder REFUSES an existing directory rather than clearing one,
          # so a mistyped path can never land on somebody's ~/.radicle.
          # Named per spec. Each matrix job has its own runner and its own
          # $RUNNER_TEMP, so a shared name would not actually collide — but two
          # specs seeding into a path called "write-e2e-profile" reads as a
          # mistake to the next person, and the failure it would cause if the
          # jobs ever shared a runner is a silent one.
          scratch="$RUNNER_TEMP/${{ matrix.spec }}-e2e-profile"
          seeded=$(cd radicle/rust-ffi && cargo run --quiet --example seed_write_profile -- "$scratch")
          rad_home=$(printf '%s\n' "$seeded" | sed -n '1p')
          # storage/ is the marker LocalStore uses to decide a profile is real.
          # Without it the spec fails at "the seeded profile is visible", which
          # would read as a module bug rather than as a seeding failure.
          test -d "$rad_home/storage" || {
            echo "::error::seed_write_profile produced no storage/ under $rad_home"
            exit 1
          }
          echo "rid:   $(printf '%s\n' "$seeded" | sed -n '2p')"
          echo "issue: $(printf '%s\n' "$seeded" | sed -n '3p')"
          echo "RAD_HOME=$rad_home" >> "$GITHUB_ENV"

      # sitometres gives every run a throwaway $HOME so a spec cannot touch the
      # user's real keys, and LocalStore resolves the Radicle home from
      # RAD_HOME before $HOME/.radicle. So the seeded profile reaches the module
      # only through --env, and every local spec needs it — see
      # radicle-ui/tests/run-local-e2e.sh, which documents the failure at
      # length. Empty for the four seed-only specs, which never leave the seed
      # source and must NOT be handed a profile they have no use for.
      - name: Point the spec at the seeded profile (local-source specs)
        if: matrix.spec == 'write' || matrix.spec == 'local'
        run: echo "SPEC_ENV=--env RAD_HOME=$RAD_HOME" >> "$GITHUB_ENV"

      # sitometres reads $APP_DIR directly — verified by a real run. It follows
      # the /nix/store symlinks and is not confused by the <NN>- load-order
      # prefix, the two details most likely to have broken it. There is
      # deliberately NO copy into dist/: that only ever existed to collect two
      # separate sub-flake result-* symlinks into one directory, and
      # `lgs basecamp build` already does the collecting.
      #
      # There was a "The built packages carry the variant the bundle accepts"
      # step here, asserting each .lgx contained variants/linux-amd64. Removed
      # deliberately: it was a diagnostic, not a gate — it could not fail a
      # correct build, and the build's whole job is that variant. The
      # failure it guarded is written up above `Build both modules (dev)`,
      # which is where a reader hitting it will look.
      - name: Run the spec
        # Bounded well inside the job's 120, so a spec that hangs fails HERE —
        # leaving the later steps to collect logs and upload evidence. If the
        # job-level timeout fires instead it kills the whole run, artifacts and
        # all, and you are left with nothing to look at. Observed locally:
        # sitometres 0.1.0 can sit in `open` indefinitely rather than honouring
        # the spec's own timeout, so this bound is doing real work.
        timeout-minutes: 30
        run: |
          # pipefail is load-bearing: without it the `| tee` below makes the
          # step's exit status tee's, which is always 0, so a failing run would
          # report as a pass.
          set -euo pipefail
          mkdir -p ui-results ui-results/screenshots
          # --strict: an INCONCLUSIVE run is one that proved nothing, and a
          # green tick on no evidence is worse than a red one. Without it
          # sitometres exits 0 on INCONCLUSIVE by design.
          # $SPEC_ENV is deliberately UNQUOTED: it is either empty (the four
          # seed-only specs) or the two words `--env RAD_HOME=<path>` (write
          # and local), and quoting would pass the whole thing as one argument.
          # `${SPEC_ENV:-}` because `set -u` is on and the seed-only specs
          # never set it. The path cannot contain spaces — it is built from
          # $RUNNER_TEMP by the seed step above — so word splitting is safe
          # here in a way it would not be for an arbitrary value.
          # No --variant: sitometres' hostVariant() default is
          # `linux-amd64-dev`, which is exactly what `.#lgx` produces. The
          # override was needed only for the portable bundle.
          npx --yes "$SITOMETRES" run "$SPEC" \
            --app radicle_ui \
            --app-dir "$APP_DIR" \
            --basecamp "$BASECAMP_BIN" \
            ${SPEC_ENV:-} \
            --strict \
            --json  "ui-results/${{ matrix.spec }}.json" \
            --junit "ui-results/${{ matrix.spec }}.xml" \
            --artifacts ui-results/screenshots \
            2>&1 | tee ui-results/sitometres.log

      # The exit code is the primary gate; this is the belt-and-braces check,
      # in the spirit of the `qml` job's "Totals: N passed" grep. It asserts
      # against the machine report rather than the terminal summary, because
      # the summary is ANSI-coloured and has no stable "N passed" line, while
      # --json is written on every exit path.
      #
      # Three things have to hold: the verdict is a pass, every step in the
      # report passed, and the number of steps matches the number in the spec.
      # The last one is what stops a run that opened the app, did nothing else
      # and reported a clean sheet from reading as a pass.
      - name: The run proved what the spec asks
        # `always()` so the per-step breakdown is printed even when the run step
        # already failed — that listing is usually the fastest way to see which
        # step broke and why. It cannot rescue a failed run: this step only ever
        # adds a failure, never removes one.
        if: always()
        # The heredoc below is quoted, so it cannot interpolate ${{ }} — the
        # two paths come through the environment instead.
        env:
          REPORT: ui-results/${{ matrix.spec }}.json
        run: |
          set -eu
          # Explicit rather than assumed: the runner image happens to ship
          # PyYAML, but this check is the gate and must not depend on that.
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 - <<'PY'
          import json, os, sys, yaml

          report_path = os.environ["REPORT"]
          spec_path = os.environ["SPEC"]

          # sitometres writes --json from a `finally`, so a report is missing
          # only when the process never got to exit — killed by the job's
          # timeout-minutes, or OOM. Say that, rather than dying on a traceback
          # about a missing file.
          if not os.path.exists(report_path):
              print("::error::no JSON report — sitometres was killed before it could "
                    "write one (job timeout?), so nothing was proved")
              sys.exit(1)

          report = json.load(open(report_path))
          spec = yaml.safe_load(open(spec_path))
          expected = len(spec["steps"])
          steps = report.get("steps", [])

          print(f"verdict: {report.get('verdict')}")
          for s in steps:
              print(f"  [{s.get('verdict'):>12}] {s.get('name')}")

          problems = []
          if report.get("verdict") != "pass":
              problems.append(f"verdict is {report.get('verdict')!r}, expected 'pass'")
          if len(steps) != expected:
              problems.append(
                  f"report has {len(steps)} steps, spec has {expected} — "
                  "the run did not execute the whole spec"
              )
          bad = [s["name"] for s in steps if s.get("verdict") != "pass"]
          if bad:
              problems.append(f"steps that did not pass: {bad}")

          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)
          print(f"ok: all {len(steps)} steps passed")
          PY

      # Uploaded on failure only — this is the evidence you need to diagnose a
      # red run, and there is nothing to look at when it is green.
      # sitometres runs against a throwaway user-dir, and Basecamp's own log is
      # the only record of what the app did — QML errors, module load failures,
      # the calls the view actually dispatched. Verified layout, from a real
      # local run: /tmp/sitometres-<rand>/logs/basecamp_<timestamp>.log
      # (the sibling /tmp/sitometres-home-<rand> is the throwaway HOME and holds
      # no logs). The directory is reaped when sitometres exits, so this only
      # catches anything if the process was killed rather than exiting cleanly;
      # it is best-effort by nature, hence the `|| true`.
      - name: Collect Basecamp logs
        if: failure()
        run: |
          set -eu
          mkdir -p ui-results/logs
          find "${TMPDIR:-/tmp}" -maxdepth 3 -type f -name 'basecamp_*.log' \
            -path '*sitometres*' -exec cp {} ui-results/logs/ \; 2>/dev/null || true
          ls -la ui-results/logs || true
          [ -n "$(ls -A ui-results/logs 2>/dev/null)" ] \
            || echo "no basecamp log survived — sitometres reaps its user-dir on exit"

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          # Per spec: upload-artifact@v4 refuses a name another job in the same
          # run already claimed, so a shared name would fail three of the four.
          name: ui-test-evidence-${{ matrix.spec }}
          path: ui-results/
          if-no-files-found: warn
