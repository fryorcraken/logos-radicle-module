[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "35d8df0d031315219f94d1546ceb862b0e5b208f"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "1db7c5f8af3165318f9046c13ab185e24773fd59"

[modules.radicle]
flake = "path:./radicle#lgx"
role = "project"

[modules.radicle_ui]
flake = "path:./radicle-ui#lgx"
role = "project"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.1"

# QtRO module sockets live under XDG_RUNTIME_DIR/TMPDIR. A unix socket path is
# capped at 108 bytes (sun_path), and scaffold's default in-profile `xdg-tmp`
# is 88 chars under this project path — the socket name then overflowed and
# every module segfaulted at "Failed to register module for remote access",
# basecamp's own bundled ones included. macOS gets a short /tmp/lgs-<profile>
# by default; Linux keeps the long in-profile path, so set it explicitly.
#
# It must be the session's real runtime dir, not just any short path: Qt finds
# the Wayland compositor socket (wayland-0) through XDG_RUNTIME_DIR, so a
# private dir like /tmp/lgs-alice starts basecamp with no display and it exits
# immediately.
[basecamp.env]
# Surface QML errors. Basecamp does not log them itself, so a ui_qml plugin
# that fails to load looks exactly like one that was never clicked.
QT_LOGGING_RULES = "qt.qml.import.debug=true"
QT_FORCE_STDERR_LOGGING = "1"

[basecamp.profiles.alice]
runtime_dir = "/run/user/1000"

[basecamp.profiles.bob]
runtime_dir = "/run/user/1000"
