[scaffold]
version = "0.2.0"

[repos.lez]
source = "https://github.com/logos-blockchain/logos-execution-zone.git"
pin = "35d8df0d031315219f94d1546ceb862b0e5b208f"

[repos.spel]
source = "https://github.com/logos-co/spel.git"
pin = "1db7c5f8af3165318f9046c13ab185e24773fd59"

[repos.basecamp]
source = "https://github.com/logos-co/logos-basecamp.git"
pin = "bbe5da0e038ef19095690f4164a8ddaab0915821"
build = "nix-flake"
attr = "app"

[repos.lgpm]
source = "github:logos-co/logos-package-manager"
pin = "d3af2972f51d9c542537d80d60ad8d20282ddcd1"
build = "nix-flake"
attr = "cli"

[modules.radicle]
flake = "path:./radicle#lgx"
role = "project"

[modules.radicle_ui]
flake = "path:./radicle-ui#lgx"
role = "project"

[wallet]
home_dir = ".scaffold/wallet"

[framework]
kind = "default"
version = "0.1.0"

[framework.idl]
spec = "lssa-idl/0.1.0"
path = "idl"

[localnet]
port = 3040
risc0_dev_mode = true

[circuits]
version = "0.4.1"

# Why there is no `runtime_dir` on the profiles, and why WAYLAND_DISPLAY is set.
#
# `launch` exports each profile's runtime dir as both XDG_RUNTIME_DIR and
# TMPDIR, and the QtRO module sockets (`logos_token_<module>`) are created in
# it. So it has two jobs:
#   - be SHORT. A unix socket path is capped at 108 bytes (sun_path); an
#     in-project path overflowed it and every module, Basecamp's own included,
#     segfaulted at "Failed to register module for remote access".
#   - be PER PROFILE, so two profiles never share socket names (scaffold#89).
# Scaffold v0.5.0's default, /tmp/lgs-<project-hash>-<profile>, created 0700,
# does both. This file used to pin `runtime_dir = "/run/user/1000"` on alice
# AND bob, which fixed the length and overrode the separation.
#
# That pin had one other effect, and it is the reason for WAYLAND_DISPLAY
# below. libwayland resolves a relative WAYLAND_DISPLAY (the session's
# `wayland-0`) against XDG_RUNTIME_DIR, and the compositor's socket is not in
# a private /tmp dir. An ABSOLUTE WAYLAND_DISPLAY is used as-is. There is no
# X11 fallback to hide the difference: Basecamp's launcher sets
# QT_QPA_PLATFORM=wayland whenever WAYLAND_DISPLAY is set. Measured: without
# the line below Basecamp exits at startup ("Failed to create wl_display",
# then "no Qt platform plugin could be initialized"); with it, alice and bob
# run side by side, each in its own runtime dir.
#
# The uid in the path is per machine, as it was in the pin this replaces. If
# yours differs, `echo $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY` in your desktop
# session prints the value to use. On an X11 session with no Wayland
# compositor, DELETE the line instead: setting it is what makes the launcher
# force Wayland, and there is nothing there to connect to.
#
# WARNING: `lgs basecamp setup` DESTROYS every comment in this file, and still
# does on v0.5.0: a run there deleted all 29 comment lines and changed no
# value. So run `git diff scaffold.toml` after any `setup` and restore what it
# took (`git restore scaffold.toml`). Only `install` and `launch` need `setup`;
# no CI job runs it, so this bites during interactive work.
[basecamp.env]
# Qt's own logging otherwise vanishes into the platform log sink, so neither
# `lgs basecamp launch` nor the profile log captures it.
QT_FORCE_STDERR_LOGGING = "1"
# Surface QML errors. Basecamp does not log them itself, so a ui_qml plugin
# that fails to load looks exactly like one that was never clicked.
QT_LOGGING_RULES = "qt.qml.import.debug=true"
# See the block above: the runtime dir is private now, so name the socket.
WAYLAND_DISPLAY = "/run/user/1000/wayland-0"
